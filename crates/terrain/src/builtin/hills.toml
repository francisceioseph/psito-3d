id = "psito.hills"
name = { en = "Rolling hills", pt = "Colinas" }
description = { en = "Soft hills that roll on to the horizon.", pt = "Colinas suaves que seguem até o horizonte." }

[[params]]
id = "scale"
label = { en = "Number of hills", pt = "Número de colinas" }
kind = "slider"
min = 1.0
max = 8.0
