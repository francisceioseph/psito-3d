name: Windows installer

# Builds the installer of a version and attaches it to the release.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: The version to package, like v0.2.0
        type: string
        required: true

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build
        run: |
          cargo build --release --locked -p psito-3d
          cargo about generate --workspace --fail -o target/THIRD_PARTY_LICENSES.md about.hbs
      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$($env:TAG.TrimStart('v'))" packaging\windows\psito-3d.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attach it to the release
        run: gh release upload $env:TAG packaging\windows\Output\psito-3d-windows-x64-setup.exe --clobber
